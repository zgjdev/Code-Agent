name: continuity-fix-check
on:
  push:
    branches:
      - feat/plan-session-conversation-continuity
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Continuity targeted tests
        run: >
          mvn -q -DskipTests=false
          -Dtest=SessionReplayerTest,SessionStoreTest,SessionCheckpointStoreTest,SessionCompactionRecoveryTest,AgentSessionResumeTest,ContextTokenTrackerTest,ConversationHistoryCompactorTest,AutoCompactionManagerTest,SessionMemoryCompactorTest,PlannerTest,PlannerPromptTest,PlanExecuteAgentTest,PlanExecuteRecoveryTest,PlanStateStoreTest,PlanConversationReconcilerTest,MainPlanAgentFactoryTest,TurnToolPolicyTest,ToolRegistryTest
          test
      - name: Quick profile
        run: mvn -q test -Pquick
      - name: Full test suite
        run: mvn -q test -DskipTests=false
      - name: Clean package
        run: mvn -q clean package
      - name: Diff check
        run: git diff --check c6c59db74a16f434e4c81aabb1ac07c5385887de HEAD
