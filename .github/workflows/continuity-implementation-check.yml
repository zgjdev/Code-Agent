name: continuity-implementation-check
on:
  push:
    branches:
      - feat/plan-session-conversation-continuity
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Core targeted tests
        run: >
          mvn -q -DskipTests=false
          -Dtest=SessionReplayerTest,SessionCheckpointStoreTest,AgentSessionResumeTest,PlannerTest,PlanStateStoreTest,PlanConversationReconcilerTest,PlanExecuteRecoveryTest,MainPlanAgentFactoryTest
          test
