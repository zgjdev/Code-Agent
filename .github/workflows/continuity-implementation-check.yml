name: continuity-implementation-check
on:
  push:
    branches:
      - feat/plan-session-conversation-continuity
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -q -DskipTests compile
