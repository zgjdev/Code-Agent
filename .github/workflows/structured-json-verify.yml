name: structured-json-verify

on:
  push:
    branches:
      - feat/structured-json-output-reliability

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Targeted tests
        run: mvn test -DskipTests=false -Dtest=StructuredJsonExecutorTest,StructuredOutputRequestTest,ExecutionModeRouterTest,PlannerTest,ReviewResponseParserTest,SubAgentStepReviewerTest
      - name: Quick regression
        run: mvn test -Pquick
      - name: Full tests
        run: mvn test -DskipTests=false
      - name: Package
        run: mvn clean package
      - name: Diff check
        run: git diff --check origin/main...HEAD
