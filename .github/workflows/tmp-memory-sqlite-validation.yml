name: Temporary memory SQLite validation

on:
  push:
    branches:
      - refactor/long-term-memory-sqlite-persistence

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Targeted memory tests
        run: mvn -B test -DskipTests=false -Dtest=LongTermMemoryTest,MemoryManagerTest,MemoryRetrieverTest,MemoryWriteResolverTest,MemoryEmbeddingCacheTest
      - name: Quick regression
        run: mvn -B test -Pquick
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
